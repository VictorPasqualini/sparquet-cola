name: CI

# Testes em cada push/PR na main, numa matriz de versões de Python.
#   • test_cola_lib.py    → puros (sem Java/Spark real).
#   • test_split_spark.py → integração do split com SparkSession local; pula
#     sozinho (sem falhar) quando não há Java/Spark no runner.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Unit tests
        env:
          PYTHONPATH: .
        run: |
          python tests/test_cola_lib.py
          python tests/test_split_spark.py
