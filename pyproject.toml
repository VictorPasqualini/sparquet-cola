[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sparquet-cola"
# Versão é fonte única em sparquet_cola/__init__.py (__version__), lida
# dinamicamente abaixo via [tool.setuptools.dynamic]. Para subir de versão,
# altere apenas o __version__.
dynamic = ["version"]
description = "Spark data-quality library — SODA-style checks, SQL rules, schema assertions and a valid/invalid split"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Victor Pasqualini" }]
keywords = ["spark", "pyspark", "data-quality", "soda", "validation", "data-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pyspark>=3.4.0",
]

[project.urls]
Homepage = "https://github.com/VictorPasqualini/sparquet-cola"
Repository = "https://github.com/VictorPasqualini/sparquet-cola"
"Bug Tracker" = "https://github.com/VictorPasqualini/sparquet-cola/issues"

[tool.setuptools.dynamic]
version = { attr = "sparquet_cola.__version__" }

[tool.setuptools.packages.find]
# Distribuição é só o pacote `sparquet_cola`. Lista explícita (não `exclude`)
# para que testes/docs e qualquer pasta nova nunca entrem no wheel/sdist.
include = ["sparquet_cola", "sparquet_cola.*"]
